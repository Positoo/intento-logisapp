<!DOCTYPE html>
<html>
<head>
    <title>Lista de Remitos</title>
</head>
<body>

    <h1>Lista de Remitos</h1>

    <a href="{% url 'crear_remito' %}">Crear nuevo remito</a>

    <table border="1">
        <thead>
            <tr>
                <th>Número</th>
                <th>Fecha</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for remito in remitos %}
            <tr>
                <td>{{ remito.numero }}</td>
                <td>{{ remito.fecha_creacion }}</td>
                <td>{{ remito.estado }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No hay remitos</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
